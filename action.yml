name: docsbot
description: Check docs for broken links, structure and unreviewed drafts; audit structure and agent readiness
branding:
  icon: book-open
  color: blue
inputs:
  command:
    description: >-
      docsbot command and arguments, for example
      'check docs --changed-only --base origin/main -f github' or
      'agent-ready check docs --site https://docs.example.com --fail-under 70'
    required: true
  version:
    description: docsbot version to install (a module version or "latest")
    default: latest
  node:
    description: Set up Node 22 for afdocs (needed by agent-ready check)
    default: "false"
  working-directory:
    description: Folder to run the command in
    default: .
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: stable
    - if: inputs.node == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - shell: bash
      run: go install github.com/kakabisht/Docs-toolkit/cmd/docsbot@${{ inputs.version }}
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DOCSBOT_COMMAND: ${{ inputs.command }}
      # the command is word-split on purpose: it is a list of arguments
      run: docsbot $DOCSBOT_COMMAND
