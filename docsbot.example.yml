# docsbot.yml: copy to your docs repo root. Every key is optional; flags override it.

# Live site for a local repo. Absolute links to it count as internal, and
# `docsbot agent-ready check` runs afdocs against it.
base_url: https://docs.example.com

# Content root inside the repo. Auto-detected (content/en, content, docs, ...) when empty.
# content_dir: docs
# Folders searched for images and downloads.
# static_dirs: [static, public]

include: []            # globs of pages to keep, relative to the content root
exclude: ["drafts/**"] # globs of pages to skip

max_pages: 2000
follow: true      # live sites: also crawl links beyond llms.txt and the sitemap
concurrency: 8
delay: 100ms      # minimum gap between requests to one host
timeout: 20s
cache_ttl: 6h     # HTTP cache, so re-runs don't re-fetch external URLs

links:
  external: true
  exclude_urls:   # regexes of URLs never fetched
    - ^https://(www\.)?linkedin\.com/
    - ^http://localhost
  ignore_hrefs: []  # regexes of raw hrefs to skip, e.g. render-hook shorthands: ["^g$"]
  fail_on: [broken, broken-anchor]
  max_redirects: 10

check:
  fail_level: error      # lowest severity that exits 1: error | warning | info | off
  # rules:               # rule id -> error | warning | info | off (see `docsbot rules`)
  #   page-orphan: warning
  #   content-todo: off
  # schema: frontmatter.schema.json   # JSON Schema (JSON or YAML) for front matter
  # todo_patterns: ['\bTODO\b', '\bTBD\b']
  # entry_pages: [/]     # routes allowed to have no inbound links

audit:
  # structure and findability (docsbot audit)
  # tasks: tasks.yaml           # reader tasks: queries and the pages that answer them
  # query_log: searches.csv     # real searches: a query column and an optional count column
  required_metadata: [title, description]
  recommended_metadata: [tags, owner]
  max_clicks: 3
  search_top_k: 3
  stale_days: 365
  # templates:                  # replaces the defaults for these content types
  #   how-to: {steps: true, required_headings: ["prerequisites|before you begin"]}
  #   reference: {structured: true}
  # weights: {search: 2, templates: 1.5}
  # agent readiness (docsbot agent-ready check)
  afdocs: auto            # auto | on | off
  afdocs_cmd: npx -y afdocs@0.23
  afdocs_weight: 0.6      # share of the overall score that comes from afdocs
  fail_under: 0           # exit 1 when the overall score is lower
  max_page_chars: 50000
  max_depth: 4

graph:
  db: docsbot-graph.db
  # repository: my-docs        # default: the repo folder name
  # commands: [mytool]         # product CLI names; detected from code blocks when empty
  # content_types:             # glob -> content type, when front matter and heuristics are wrong
  #   "reference/**": reference
  similarity: true             # inferred related-to and overlaps-with edges
  related_threshold: 0.35      # TF-IDF cosine
  overlap_threshold: 0.5       # share of five-word sequences shared with another page
  max_related: 3

# draft write: best-practice drafts with a citation for every statement.
# With no provider the draft is extractive and nothing leaves this machine.
draft:
  # template: templates/best-practice.md  # "## " headings, <!-- guidance. query: words -->
  provider: none          # none | ollama | openai (any OpenAI-compatible server) | anthropic
  # model: llama3.1
  # endpoint: http://localhost:11434
  # api_key_env: OPENAI_API_KEY
  allow_remote: false     # must be true to send source passages to an endpoint off this machine
  # timeout: 5m

# agent run: gaps -> MCP context -> draft -> validate -> evaluate, then human approval.
# The model is the draft section's provider.
agent:
  out: drafts/agent       # never inside the docs
  max_drafts: 3           # groups drafted per run, highest priority first
  min_score: 80           # evaluation gate, 0-100
  judge: false            # also score drafts with the model (needs draft.provider)
  min_judge: 3            # lowest judge score per criterion, 1-5
  mcp: []                 # product context servers, for example:
  #  - name: product-kb
  #    command: [docsbot, mcp, serve, --no-repo, --kb, ../product-kb]
  #  - name: api-catalog
  #    url: https://mcp.example.com/mcp
  #    allow_remote: true                    # needed for a server off this machine
  #    header_env: {Authorization: CATALOG_TOKEN}
  #    tool: search                          # default: first tool named *search*
  #    query_arg: query
  #    max_results: 5
